name: Release Novel Forge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/application/version-core.ts
      - docs/releases/*.md
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  verify:
    name: release verify (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run --silent benchmark:constrained-runtime
      - run: npm run --silent benchmark:prompts
      - run: npm run verify:release
      - run: npm run test:release
      - run: npm pack --dry-run

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" "$GITHUB_SHA" -m "Novel Forge v${{ steps.version.outputs.version }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"
      - name: Publish GitHub release
        if: steps.tag.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --verify-tag \
            --title "Novel Forge v${{ steps.version.outputs.version }}" \
            --notes-file "docs/releases/v${{ steps.version.outputs.version }}.md"
      - name: Skip duplicate release
        if: steps.tag.outputs.exists == 'true'
        run: echo "v${{ steps.version.outputs.version }} already exists; no duplicate release was created."
