schema_version: 1.0.0
cases:
  - id: structured-compile-scene
    job_type: compile-scene-contract
    prompt: Compile the supplied scene facts into a compact scene contract.
    context: |
      REC-SCENE-001 is authoritative: the scene occurs at the east gate before dawn.
      REC-SCENE-099 is explicitly superseded.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-SCENE-001]
      forbidden_record_ids: [REC-SCENE-099]
      must_stop: false
  - id: structured-plan-scene
    job_type: plan-scene
    prompt: Plan the next scene using only active authoritative records.
    context: |
      REC-PLAN-001 is active and requires Mara to retrieve the ledger.
      REC-PLAN-099 is a discarded alternate in which Mara burns it.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-PLAN-001]
      forbidden_record_ids: [REC-PLAN-099]
      must_stop: false
  - id: structured-state-delta
    job_type: extract-state-delta
    prompt: Extract only state changes supported by the supplied scene evidence.
    context: |
      REC-STATE-001 is the governing record. The sealed door is opened in this scene.
      REC-STATE-099 is a rejected note claiming the door remains sealed.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-STATE-001]
      forbidden_record_ids: [REC-STATE-099]
      must_stop: false
  - id: structured-factual-claims
    job_type: extract-factual-claims
    prompt: Extract factual claims and cite the active evidence record.
    context: |
      REC-FACT-001 states that the train arrived at 06:40.
      REC-FACT-099 is an unverified guess that it arrived at 07:10.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-FACT-001]
      forbidden_record_ids: [REC-FACT-099]
      must_stop: false
  - id: structured-continuity-critic
    job_type: critic-continuity
    prompt: Identify continuity problems using the active record.
    context: |
      REC-CONT-001 establishes that Jo's left wrist is injured.
      REC-CONT-099 is a stale draft note that says the right wrist is injured.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-CONT-001]
      forbidden_record_ids: [REC-CONT-099]
      must_stop: false
  - id: structured-patch-spans
    job_type: patch-spans
    prompt: Return a bounded patch plan for the identified span.
    context: |
      REC-PATCH-001 authorizes changing only paragraph three.
      REC-PATCH-099 is an unauthorized request to rewrite the whole scene.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-PATCH-001]
      forbidden_record_ids: [REC-PATCH-099]
      must_stop: false
