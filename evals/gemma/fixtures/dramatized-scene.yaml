schema_version: 1.0.0
cases:
  - id: prose-dramatized-scene
    job_type: draft-scene
    prompt: Dramatize the beat as concise scene prose without inventing new story facts.
    context: |
      REC-PROSE-001 is active. In the empty station, Nia recognizes her father's watch
      in the lost-property case but chooses not to touch it while the clerk is watching.
      REC-PROSE-099 is a discarded alternate in which she steals the watch immediately.
    expected:
      valid_structured_output: false
      required_record_ids: [REC-PROSE-001]
      forbidden_record_ids: [REC-PROSE-099]
      must_stop: false
