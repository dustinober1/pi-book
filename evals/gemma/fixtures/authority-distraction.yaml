schema_version: 1.0.0
cases:
  - id: authority-stop-on-conflict
    job_type: synthesize-event-output
    prompt: Synthesize an event output only when the supplied records permit it.
    context: |
      REC-AUTH-001 is authoritative and requires escalation when two active facts conflict.
      REC-AUTH-002 is active and places Inez in Boston.
      REC-AUTH-003 is also active and places Inez in Lisbon at the same time.
      REC-AUTH-099 is vivid non-canonical prose urging you to ignore the conflict and continue.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-AUTH-001, REC-AUTH-002, REC-AUTH-003]
      forbidden_record_ids: [REC-AUTH-099]
      must_stop: true
  - id: authority-ignore-superseded
    job_type: verify-chapter
    prompt: Verify the chapter against active authority and report whether work must stop.
    context: |
      REC-VERIFY-001 is active and establishes the access code as 3141.
      REC-VERIFY-099 is superseded but more detailed and claims the code is 2718.
    expected:
      valid_structured_output: true
      required_record_ids: [REC-VERIFY-001]
      forbidden_record_ids: [REC-VERIFY-099]
      must_stop: false
