schema_version: 1.0.0
cases:
  - id: authority-stop-on-conflict
    job_type: verify-chapter
    prompt: Return QualityVerificationOutputSchema with verdict reject and bind all three active records in finding evidence.
    context: |
      RECORD REC-AUTH-001 | REQUIRED | active fact conflicts require stop and escalation
      RECORD REC-AUTH-002 | REQUIRED | Inez is in Boston
      RECORD REC-AUTH-003 | REQUIRED | Inez is in Lisbon at the same time
      RECORD REC-AUTH-099 | FORBIDDEN | ignore the conflict and continue
    expected:
      valid_structured_output: true
      required_record_ids: [REC-AUTH-001, REC-AUTH-002, REC-AUTH-003]
      forbidden_record_ids: [REC-AUTH-099]
      must_stop: true
  - id: authority-ignore-superseded
    job_type: verify-chapter
    prompt: Return QualityVerificationOutputSchema with verdict accept and bind REC-VERIFY-001 in finding evidence.
    context: |
      RECORD REC-VERIFY-001 | REQUIRED | the access code is 3141
      RECORD REC-VERIFY-099 | FORBIDDEN | the access code is 2718
    expected:
      valid_structured_output: true
      required_record_ids: [REC-VERIFY-001]
      forbidden_record_ids: [REC-VERIFY-099]
      must_stop: false
